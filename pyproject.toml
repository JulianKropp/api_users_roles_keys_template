[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-users-roles-keys"
version = "0.1.0"
description = "API template for user/roles/api_keys management"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "fastapi[all]>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "pymongo>=4.0.0",
    "slowapi>=0.1.8",
    "fastapi-limiter>=0.1.5",
    "mongoengine>=0.27.0",
    "mongo-types>=0.15.1",
    "python-multipart>=0.0.6",
    "bcrypt>=4.0.0",
    "httpx>=0.25.0",
    "aiortc>=1.5.0",
    "numpy>=1.24.0",
    "blinker>=1.9.0",
    "opuslib>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mongomock>=4.1.0",
    "mypy>=1.0.0",
    "types-ujson",
    "types-requests",
    "types-redis"
]

[project.scripts]
api = "main:main"

[tool.uv.sources]
fastapi = { git = "https://github.com/tiangolo/fastapi.git" }
uvicorn = { git = "https://github.com/encode/uvicorn.git" }

[tool.hatch.build.targets.wheel]
packages = ["."]

